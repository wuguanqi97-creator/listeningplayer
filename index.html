<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课文听力播放器</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"] {
  --color-bg: #f7f6f2;
  --color-surface: #f9f8f5;
  --color-surface-2: #fbfbf9;
  --color-surface-offset: #f3f0ec;
  --color-surface-dynamic: #e6e4df;
  --color-border: #d4d1ca;
  --color-divider: #dcd9d5;
  --color-text: #28251d;
  --color-text-muted: #7a7974;
  --color-text-faint: #bab9b4;
  --color-primary: #01696f;
  --color-primary-hover: #0c4e54;
  --color-primary-highlight: #cedcd8;
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
  --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
  --radius-xl: 1rem; --radius-full: 9999px;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-12:3rem;
  --text-xs:clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
  --text-sm:clamp(0.875rem,0.8rem + 0.35vw,1rem);
  --text-base:clamp(1rem,0.95rem + 0.25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + 0.75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --font-body:'Satoshi','Helvetica Neue',sans-serif;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"] {
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#1d1c1a;--color-surface-dynamic:#2d2c2a;
  --color-border:#393836;--color-divider:#262523;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;
  --color-primary-highlight:#313b3b;
  --shadow-md:0 4px 12px oklch(0 0 0 / 0.3);
  --shadow-lg:0 12px 32px oklch(0 0 0 / 0.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{
  min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);
  color:var(--color-text);background:var(--color-bg);
  padding:var(--space-6) var(--space-4);
  transition:background var(--transition),color var(--transition);
}

/* Layout */
.layout{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);align-items:start;}
@media(max-width:680px){.layout{grid-template-columns:1fr;}}

/* Header */
.header{grid-column:1/-1;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:var(--space-2);}
.header-text .lesson-label{font-size:var(--text-xs);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--color-primary);margin-bottom:var(--space-1);}
.header-text .lesson-title{font-size:var(--text-xl);font-weight:700;line-height:1.15;}
.header-text .lesson-sub{font-size:var(--text-sm);color:var(--color-text-muted);margin-top:var(--space-1);}

/* Theme btn */
.theme-btn{
  background:var(--color-surface);
  border:1px solid oklch(from var(--color-text) l c h / 0.10);
  border-radius:var(--radius-full);width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  color:var(--color-text-muted);cursor:pointer;flex-shrink:0;
  transition:background var(--transition),color var(--transition);
}
.theme-btn:hover{background:var(--color-primary-highlight);color:var(--color-primary);}

/* Panel card */
.panel{
  background:var(--color-surface);
  border:1px solid oklch(from var(--color-text) l c h / 0.10);
  border-radius:var(--radius-xl);box-shadow:var(--shadow-md);
  overflow:hidden;
}
.panel-head{
  padding:var(--space-4) var(--space-5);
  border-bottom:1px solid var(--color-divider);
  display:flex;align-items:center;justify-content:space-between;
}
.panel-title{font-size:var(--text-sm);font-weight:600;}
.panel-badge{
  font-size:var(--text-xs);padding:2px var(--space-2);
  background:var(--color-primary-highlight);color:var(--color-primary);
  border-radius:var(--radius-full);font-weight:500;
}

/* Upload area */
.upload-area{
  margin:var(--space-4) var(--space-5);
  border:2px dashed var(--color-border);border-radius:var(--radius-lg);
  padding:var(--space-6) var(--space-4);text-align:center;cursor:pointer;
  transition:border-color var(--transition),background var(--transition);
}
.upload-area:hover,.upload-area.dragover{border-color:var(--color-primary);background:var(--color-primary-highlight);}
.upload-icon{color:var(--color-text-faint);margin-bottom:var(--space-2);}
.upload-text{font-size:var(--text-sm);color:var(--color-text-muted);}
.upload-text strong{color:var(--color-primary);}
.upload-hint{font-size:var(--text-xs);color:var(--color-text-faint);margin-top:var(--space-1);}
#file-input{display:none;}

/* Track list */
.track-list{max-height:320px;overflow-y:auto;padding:var(--space-2) 0;}
.track-list:empty::after{
  content:'还没有音频，请上传文件';
  display:block;padding:var(--space-8) var(--space-4);
  text-align:center;font-size:var(--text-sm);color:var(--color-text-faint);
}
.track-item{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-5);cursor:pointer;
  transition:background var(--transition);position:relative;
}
.track-item:hover{background:var(--color-surface-offset);}
.track-item.active{background:var(--color-primary-highlight);}
.track-item.active .track-item-name{color:var(--color-primary);font-weight:600;}
.track-num{
  font-size:var(--text-xs);color:var(--color-text-faint);
  min-width:20px;text-align:right;font-variant-numeric:tabular-nums;
}
.track-item-icon{
  width:32px;height:32px;border-radius:var(--radius-md);flex-shrink:0;
  background:var(--color-surface-offset);
  display:flex;align-items:center;justify-content:center;
  color:var(--color-text-faint);transition:background var(--transition),color var(--transition);
}
.track-item.active .track-item-icon{background:var(--color-primary-highlight);color:var(--color-primary);}
.track-item-info{flex:1;min-width:0;}
.track-item-name{font-size:var(--text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-item-dur{font-size:var(--text-xs);color:var(--color-text-faint);font-variant-numeric:tabular-nums;}
.track-item-del{
  width:28px;height:28px;border-radius:var(--radius-full);
  border:none;background:none;cursor:pointer;
  color:var(--color-text-faint);display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity var(--transition),color var(--transition),background var(--transition);
  flex-shrink:0;
}
.track-item:hover .track-item-del{opacity:1;}
.track-item-del:hover{color:var(--color-text);background:var(--color-surface-dynamic);}

/* Player panel */
.player-panel{background:var(--color-surface);border:1px solid oklch(from var(--color-text) l c h / 0.10);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);padding:var(--space-6);}

.now-playing-label{font-size:var(--text-xs);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-faint);margin-bottom:var(--space-4);}

.track-art{
  width:100%;aspect-ratio:1;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,var(--color-primary-highlight),var(--color-surface-offset));
  display:flex;align-items:center;justify-content:center;
  margin-bottom:var(--space-5);color:var(--color-primary);
}

.player-name{font-size:var(--text-base);font-weight:700;margin-bottom:var(--space-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-meta{font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:var(--space-5);}

/* Progress */
.progress-wrap{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-5);}
.time-label{font-size:var(--text-xs);color:var(--color-text-muted);min-width:32px;font-variant-numeric:tabular-nums;}
.progress-bar{flex:1;height:4px;background:var(--color-surface-offset);border-radius:var(--radius-full);cursor:pointer;position:relative;}
.progress-fill{height:100%;background:var(--color-primary);border-radius:var(--radius-full);width:0%;pointer-events:none;transition:width .1s linear;}
.progress-bar:hover .progress-fill{background:var(--color-primary-hover);}

/* Controls */
.controls{display:flex;align-items:center;justify-content:center;gap:var(--space-4);margin-bottom:var(--space-5);}
.ctrl-btn{
  width:40px;height:40px;border-radius:var(--radius-full);
  background:var(--color-surface-offset);border:none;cursor:pointer;
  color:var(--color-text-muted);display:flex;align-items:center;justify-content:center;
  transition:background var(--transition),color var(--transition);
}
.ctrl-btn:hover{background:var(--color-primary-highlight);color:var(--color-primary);}
.ctrl-play{width:54px;height:54px;background:var(--color-primary);color:#fff;box-shadow:var(--shadow-md);}
.ctrl-play:hover{background:var(--color-primary-hover);}

/* Speed */
.speed-row{display:flex;align-items:center;justify-content:center;gap:var(--space-2);}
.speed-label{font-size:var(--text-xs);color:var(--color-text-muted);}
.speed-btn{
  padding:2px var(--space-3);background:var(--color-surface-offset);
  border:1px solid transparent;border-radius:var(--radius-full);
  font-size:var(--text-xs);font-weight:500;cursor:pointer;color:var(--color-text-muted);
  transition:background var(--transition),color var(--transition),border-color var(--transition);
}
.speed-btn:hover{color:var(--color-primary);}
.speed-btn.active{background:var(--color-primary-highlight);border-color:var(--color-primary);color:var(--color-primary);}

/* Empty player */
.player-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--space-12) var(--space-6);text-align:center;gap:var(--space-3);
  color:var(--color-text-faint);
}
.player-empty p{font-size:var(--text-sm);max-width:24ch;}
</style>
</head>
<body>

<div class="layout">
  <!-- Header -->
  <div class="header">
    <div class="header-text">
      <div class="lesson-label">课文听力</div>
      <div class="lesson-title">听力播放器</div>
      <div class="lesson-sub">一次上传多个音频，点击选择播放</div>
    </div>
    <button class="theme-btn" data-theme-toggle aria-label="切换深色模式">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <!-- Left: Track list -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">播放列表</span>
      <span class="panel-badge" id="count-badge">0 首</span>
    </div>

    <div class="upload-area" id="upload-area">
      <div class="upload-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 15V3m0 0L8 7m4-4l4 4"/><path d="M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/>
        </svg>
      </div>
      <div class="upload-text"><strong>点击上传</strong>或拖拽多个音频</div>
      <div class="upload-hint">MP3 · WAV · M4A · OGG · 支持多选</div>
      <input type="file" id="file-input" accept="audio/*" multiple>
    </div>

    <div class="track-list" id="track-list"></div>
  </div>

  <!-- Right: Player -->
  <div class="player-panel" id="player-panel">
    <div class="player-empty" id="player-empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      <p>从左侧列表选择一首音频开始播放</p>
    </div>

    <div id="player-content" style="display:none">
      <div class="now-playing-label">正在播放</div>

      <div class="track-art">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </div>

      <div class="player-name" id="player-name">—</div>
      <div class="player-meta" id="player-meta">准备播放</div>

      <div class="progress-wrap">
        <span class="time-label" id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="time-label" id="time-total">0:00</span>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="btn-prev" title="上一首">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-back" title="后退5秒">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2.5 12a9.5 9.5 0 1 1 9.5 9.5"/><path d="M2 7v5h5"/>
          </svg>
        </button>
        <button class="ctrl-btn ctrl-play" id="btn-play" title="播放/暂停">
          <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-fwd" title="前进5秒">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 12a9.5 9.5 0 1 0-9.5 9.5"/><path d="M22 7v5h-5"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="btn-next" title="下一首">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-12v9l6-4.5z"/><rect x="16" y="6" width="2" height="12"/></svg>
        </button>
      </div>

      <div class="speed-row">
        <span class="speed-label">速度：</span>
        <button class="speed-btn" data-speed="0.75">×0.75</button>
        <button class="speed-btn active" data-speed="1">×1.0</button>
        <button class="speed-btn" data-speed="1.25">×1.25</button>
        <button class="speed-btn" data-speed="1.5">×1.5</button>
      </div>
    </div>
  </div>
</div>

<audio id="audio-el"></audio>

<script>
// Theme
(function(){
  const btn=document.querySelector('[data-theme-toggle]'),root=document.documentElement;
  let dark=matchMedia('(prefers-color-scheme:dark)').matches;
  root.setAttribute('data-theme',dark?'dark':'light');
  btn.addEventListener('click',()=>{
    dark=!dark;root.setAttribute('data-theme',dark?'dark':'light');
    btn.innerHTML=dark
      ?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
      :'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  });
})();

// State
const tracks = []; // {name, url, duration}
let currentIdx = -1;
const audio = document.getElementById('audio-el');

// DOM refs
const trackList = document.getElementById('track-list');
const countBadge = document.getElementById('count-badge');
const playerEmpty = document.getElementById('player-empty');
const playerContent = document.getElementById('player-content');
const playerName = document.getElementById('player-name');
const playerMeta = document.getElementById('player-meta');
const progressFill = document.getElementById('progress-fill');
const progressBar = document.getElementById('progress-bar');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');

function fmt(s){
  if(!isFinite(s))return '—';
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return m+':'+String(sec).padStart(2,'0');
}

function renderList(){
  trackList.innerHTML='';
  countBadge.textContent=tracks.length+' 首';
  tracks.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='track-item'+(i===currentIdx?' active':'');
    el.innerHTML=`
      <span class="track-num">${i+1}</span>
      <div class="track-item-icon">
        ${i===currentIdx
          ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
          : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>'}
      </div>
      <div class="track-item-info">
        <div class="track-item-name" title="${t.name}">${t.name}</div>
        <div class="track-item-dur">${t.duration||'—'}</div>
      </div>
      <button class="track-item-del" data-idx="${i}" title="删除" aria-label="删除">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>`;
    el.addEventListener('click',(e)=>{
      if(e.target.closest('.track-item-del'))return;
      playTrack(i);
    });
    el.querySelector('.track-item-del').addEventListener('click',()=>removeTrack(i));
    trackList.appendChild(el);
  });
}

function playTrack(idx){
  if(idx<0||idx>=tracks.length)return;
  currentIdx=idx;
  const t=tracks[idx];
  audio.src=t.url;
  audio.load();
  audio.play();
  playerName.textContent=t.name;
  playerMeta.textContent=t.duration||'加载中…';
  playerEmpty.style.display='none';
  playerContent.style.display='block';
  renderList();
}

function removeTrack(idx){
  URL.revokeObjectURL(tracks[idx].url);
  tracks.splice(idx,1);
  if(currentIdx===idx){
    audio.pause();audio.src='';
    currentIdx=-1;
    playerEmpty.style.display='flex';
    playerContent.style.display='none';
  } else if(currentIdx>idx){
    currentIdx--;
  }
  renderList();
}

// Add files
function addFiles(files){
  Array.from(files).forEach(file=>{
    if(!file.type.startsWith('audio/'))return;
    const url=URL.createObjectURL(file);
    const name=file.name.replace(/\.[^.]+$/,'');
    const entry={name,url,duration:null};
    tracks.push(entry);
    // get duration
    const tmp=new Audio(url);
    tmp.addEventListener('loadedmetadata',()=>{
      entry.duration=fmt(tmp.duration);
      renderList();
    });
  });
  renderList();
}

// Upload
const uploadArea=document.getElementById('upload-area');
const fileInput=document.getElementById('file-input');
uploadArea.addEventListener('click',()=>fileInput.click());
uploadArea.addEventListener('dragover',e=>{e.preventDefault();uploadArea.classList.add('dragover');});
uploadArea.addEventListener('dragleave',()=>uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop',e=>{
  e.preventDefault();uploadArea.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change',()=>{addFiles(fileInput.files);fileInput.value='';});

// Controls
document.getElementById('btn-play').addEventListener('click',()=>{
  if(currentIdx<0&&tracks.length>0)return playTrack(0);
  if(audio.paused)audio.play();else audio.pause();
});
document.getElementById('btn-back').addEventListener('click',()=>audio.currentTime=Math.max(0,audio.currentTime-5));
document.getElementById('btn-fwd').addEventListener('click',()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5));
document.getElementById('btn-prev').addEventListener('click',()=>{if(currentIdx>0)playTrack(currentIdx-1);});
document.getElementById('btn-next').addEventListener('click',()=>{if(currentIdx<tracks.length-1)playTrack(currentIdx+1);});

audio.addEventListener('play',()=>{iconPlay.style.display='none';iconPause.style.display='block';});
audio.addEventListener('pause',()=>{iconPlay.style.display='block';iconPause.style.display='none';});
audio.addEventListener('ended',()=>{
  iconPlay.style.display='block';iconPause.style.display='none';
  if(currentIdx<tracks.length-1)playTrack(currentIdx+1);
});
audio.addEventListener('loadedmetadata',()=>{
  timeTotal.textContent=fmt(audio.duration);
  if(tracks[currentIdx])tracks[currentIdx].duration=fmt(audio.duration);
  playerMeta.textContent=fmt(audio.duration);
  renderList();
});
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration)return;
  progressFill.style.width=(audio.currentTime/audio.duration*100)+'%';
  timeCurrent.textContent=fmt(audio.currentTime);
});
progressBar.addEventListener('click',e=>{
  const r=progressBar.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

// Speed
document.querySelectorAll('.speed-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    audio.playbackRate=parseFloat(btn.dataset.speed);
  });
});
</script>
